site: SmartBranch360
vlans:
  - id: 10
    name: EMPLOYEE
    subnet: 10.10.10.0/24
    gateway: 10.10.10.1
    dhcp: true
  - id: 20
    name: GUEST
    subnet: 10.10.20.0/24
    gateway: 10.10.20.1
    dhcp: true
  - id: 30
    name: SERVER
    subnet: 10.10.30.0/24
    gateway: 10.10.30.1
    dhcp: false
  - id: 99
    name: MANAGEMENT
    subnet: 10.10.99.0/24
    gateway: 10.10.99.1
    dhcp: false

devices:
  server:
    ip: 10.10.30.10
    vlan: 30
  management_pc:
    ip: 10.10.99.10
    vlan: 99
  sw1_management:
    ip: 10.10.99.2
    vlan: 99
  sw2_management:
    ip: 10.10.99.3
    vlan: 99

trunks:
  - device: SW1
    interface: GigabitEthernet0/1
    allowed_vlans: [10, 20, 30, 99]
  - device: SW1
    interface: FastEthernet0/24
    allowed_vlans: [10, 20, 30, 99]
  - device: SW2
    interface: FastEthernet0/24
    allowed_vlans: [10, 20, 30, 99]

security:
  guest_may_access_internal_vlans: false
  ssh_allowed_subnet: 10.10.99.0/24
